  note: >-
    Lambda returns the standard AWS error envelope. The HTTP status is carried
    on the response; the exception name appears as the error code/type. This is
    not RFC 9457 application/problem+json.
description: >-
  API-level error types. The status codes are derived from the OpenAPI 4xx
  responses (400/403/404/409/429 are declared per operation); titles and
  remediation are enriched from the AWS Lambda API common-errors reference.
