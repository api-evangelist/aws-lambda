naftiko: 1.0.0-alpha2
info:
  label: AWS Lambda API
  description: 'AWS Lambda API. 3 operations. Lead operation: Aws Lambda List Tags. Self-contained Naftiko capability covering
    one Aws Lambda business surface.'
  tags:
  - Aws Lambda
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_LAMBDA_API_KEY: AWS_LAMBDA_API_KEY
capability:
  consumes:
  - type: http
    namespace: aws-lambda-general
    baseUri: https://lambda.{region}.amazonaws.com
    description: AWS Lambda API business capability. Self-contained, no shared references.
    resources:
    - name: 2015-03-31-tags-ARN
      path: /2015-03-31/tags/{ARN}
      operations:
      - name: listtags
        method: GET
        description: Aws Lambda List Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ARN
          in: path
          type: string
          description: The function's Amazon Resource Name (ARN)
          required: true
      - name: tagresource
        method: POST
        description: Aws Lambda Add Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ARN
          in: path
          type: string
          description: The function's Amazon Resource Name (ARN)
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: untagresource
        method: DELETE
        description: Aws Lambda Remove Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ARN
          in: path
          type: string
          description: The function's Amazon Resource Name (ARN)
          required: true
        - name: tagKeys
          in: query
          type: array
          description: List of tag keys to remove
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_LAMBDA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: aws-lambda-general-rest
    port: 8080
    description: REST adapter for AWS Lambda API. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/2015-03-31/tags/{arn}
      name: 2015-03-31-tags-arn
      description: REST surface for 2015-03-31-tags-ARN.
      operations:
      - method: GET
        name: listtags
        description: Aws Lambda List Tags
        call: aws-lambda-general.listtags
        with:
          ARN: rest.ARN
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: tagresource
        description: Aws Lambda Add Tags
        call: aws-lambda-general.tagresource
        with:
          ARN: rest.ARN
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: untagresource
        description: Aws Lambda Remove Tags
        call: aws-lambda-general.untagresource
        with:
          ARN: rest.ARN
          tagKeys: rest.tagKeys
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aws-lambda-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS Lambda API. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: aws-lambda-list-tags
      description: Aws Lambda List Tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: aws-lambda-general.listtags
      with:
        ARN: tools.ARN
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-lambda-add-tags
      description: Aws Lambda Add Tags
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: aws-lambda-general.tagresource
      with:
        ARN: tools.ARN
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-lambda-remove-tags
      description: Aws Lambda Remove Tags
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: aws-lambda-general.untagresource
      with:
        ARN: tools.ARN
        tagKeys: tools.tagKeys
      outputParameters:
      - type: object
        mapping: $.
