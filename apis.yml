- aid: aws-lambda:aws-lambda-runtime-api
  name: AWS Lambda Runtime API
  description: >-
    The Lambda Runtime API enables you to use custom runtimes to run functions in any programming language.
    The runtime API provides an HTTP API for custom runtimes to receive invocation events from Lambda
    and send response data back within the Lambda execution environment.
  image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
  humanURL: https://docs.aws.amazon.com/lambda/latest/dg/runtimes-api.html
