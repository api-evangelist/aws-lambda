- aid: aws-lambda:aws-lambda-logs-api
  name: AWS Lambda Logs API
  description: >-
    The Lambda Logs API enables extensions to subscribe to log streams generated by the Lambda platform,
    function code, and extensions within the execution environment, providing access to log data for processing
