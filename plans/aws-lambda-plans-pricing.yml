rate_limit_statements:
- An EPU supports one event poller, each providing up to 1 MB/s throughput. Each SQS ESM requires a minimum
  of 2 event pollers.
- Each EPU supports up to 20 MB/s throughput capacity for event polling, with a default of 10 event pollers.
  Each event poller can scale up to 5 MB/s throughput.
- You can allocate any amount of memory to your function between 128 MB and 10,240 MB, in 1 MB increments.
- 'Duration: Pricing is calculated per second, with a 1-minute minimum.'
- your MicroVM can vertically scale up to 4x the baseline (up to 8GB / 4vCPU)
