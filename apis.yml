- aid: aws-lambda:aws-lambda-telemetry-api
  name: AWS Lambda Telemetry API
  description: >-
    The Lambda Telemetry API lets you collect telemetry data directly from the Lambda execution environment.
    Extensions can subscribe to telemetry streams for platform telemetry, function logs, and extension
    logs to send data to custom destinations for monitoring and observability.
  image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
  humanURL: https://docs.aws.amazon.com/lambda/latest/dg/telemetry-api.html
