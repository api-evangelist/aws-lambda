  /2015-03-31/functions/{FunctionName}/invocations:
    post:
      operationId: invoke
      summary: Aws Lambda Invoke a Function
      description: Invokes a Lambda function. You can invoke a function synchronously and wait for the response, or asynchronously. By default, Lambda invokes your function synchronously. To invoke a function asynchronously, set InvocationType to Event. For asynchronous invocation, Lambda adds the event to a queue and returns a success response without additional information. For a DryRun invocation type, verify parameter values and permissions without running the function.
      tags:
      - Functions
      parameters:
      - $ref: '#/components/parameters/functionName'
      - $ref: '#/components/parameters/qualifier'
      - name: X-Amz-Invocation-Type
        in: header
        description: Choose from RequestResponse (synchronous, default), Event (asynchronous), or DryRun (validate parameters and permissions)
        schema:
          type: string
          enum:
          - RequestResponse
          - Event
          - DryRun
        example: RequestResponse
      - name: X-Amz-Log-Type
        in: header
        description: Set to Tail to include the execution log in the response
        schema:
          type: string
          enum:
          - None
          - Tail
        example: None
      - name: X-Amz-Client-Context
        in: header
        description: Base64-encoded client context data to pass to the function in the context object. Maximum 3583 bytes of base64-encoded data.
        schema:
          type: string
        example: example_value
      requestBody:
        description: The JSON payload to pass to the function
        content:
          application/json:
            schema:
              type: object
            examples:
              InvokeRequestExample:
                summary: Default invoke request
                x-microcks-default: true
                value: {}
      responses:
        '200':
          description: Function invoked successfully (synchronous)
          headers:
            X-Amz-Function-Error:
              description: If present, indicates the function returned an error. Contains Handled or Unhandled.
              schema:
                type: string
            X-Amz-Log-Result:
              description: Last 4 KB of the base64-encoded execution log, included when X-Amz-Log-Type is Tail
              schema:
                type: string
            X-Amz-Executed-Version:
              description: The version of the function that executed
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
              examples:
                Invoke200Example:
                  summary: Default invoke 200 response
                  x-microcks-default: true
                  value: {}
        '202':
          description: Function invoked successfully (asynchronous)
        '204':
          description: Dry run successful (permissions verified)
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invoke404Example:
                  summary: Default invoke 404 response
                  x-microcks-default: true
                  value:
                    Type: example_value
                    Message: example_value
                    Code: example_value
        '429':
          description: Too many requests or concurrency limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invoke429Example:
                  summary: Default invoke 429 response
                  x-microcks-default: true
                  value:
                    Type: example_value
                    Message: example_value
                    Code: example_value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    marker:
      name: Marker
      in: query
      description: A pagination token returned by a previous call. Use this token to retrieve the next page of results.
      schema:
        type: string
    maxItems:
      name: MaxItems
      in: query
      description: Maximum number of items to return (1-10000)
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    functionVersion:
      name: FunctionVersion
      in: query
      description: Set to ALL to include entries for all published versions
      schema:
        type: string
        enum:
        - ALL
    functionName:
      name: FunctionName
      in: path
      required: true
      description: The name, ARN, or partial ARN of the Lambda function. Can be a function name, a function ARN, or a partial ARN.
      schema:
        type: string
        minLength: 1
        maxLength: 170
    masterRegion:
      name: MasterRegion
      in: query
      description: For Lambda@Edge functions, the AWS Region of the master function
      schema:
        type: string
    qualifier:
      name: Qualifier
      in: query
      description: A version number or alias name
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    FunctionCode:
      type: object
      description: The code for the Lambda function. You can provide your deployment package as a .zip file archive uploaded directly, from S3, or as a container image from Amazon ECR.
      properties:
        ZipFile:
          type: string
          format: byte
          description: Base64-encoded contents of the deployment package .zip file
          example: example_value
        S3Bucket:
          type: string
          description: An S3 bucket in the same AWS Region as your function
          example: example_value
        S3Key:
          type: string
          description: The S3 key of the deployment package
          example: example_value
        S3ObjectVersion:
          type: string
          description: The version of the S3 object for versioned buckets
          example: example_value
        ImageUri:
          type: string
          description: URI of a container image in the Amazon ECR registry
          example: example_value
    UpdateFunctionCodeRequest:
      type: object
      description: Request body for updating a function's code
      properties:
        ZipFile:
          type: string
          format: byte
          description: Base64-encoded contents of the deployment package. AWS SDK and CLI clients handle encoding automatically.
          example: example_value
        S3Bucket:
          type: string
          description: An S3 bucket in the same AWS Region as the function
          example: example_value
        S3Key:
          type: string
          description: The S3 key of the deployment package
          example: example_value
        S3ObjectVersion:
          type: string
          description: For versioned S3 objects, the version of the deployment package
          example: example_value
        ImageUri:
          type: string
          description: URI of a container image in Amazon ECR
          example: example_value
        Publish:
          type: boolean
          description: Set to true to publish a new version of the function after updating the code
          default: false
          example: true
        DryRun:
          type: boolean
          description: Set to true to validate the request without updating the code
          default: false
          example: true
        RevisionId:
          type: string
          description: Update only if the revision ID matches
          example: '500123'
        Architectures:
          type: array
          items:
            type: string
            enum:
            - x86_64
            - arm64
          maxItems: 1
          example: []
    ErrorResponse:
      type: object
      description: Error response from the Lambda API
      properties:
        Type:
          type: string
          description: The error type
          example: example_value
        Message:
          type: string
          description: The error message
          example: example_value
        Code:
          type: string
          description: The error code
          example: example_value
    UpdateFunctionConfigurationRequest:
      type: object
      description: Request body for updating a function's configuration
      properties:
        Role:
          type: string
          description: The ARN of the function's execution role
          example: example_value
        Handler:
          type: string
          description: The name of the function handler
          example: example_value
        Description:
          type: string
          description: A description of the function
          maxLength: 256
          example: A sample description.
        Timeout:
          type: integer
          description: Execution timeout in seconds
          minimum: 1
          maximum: 900
          example: 10
        MemorySize:
          type: integer
          description: Memory allocated in MB
          minimum: 128
          maximum: 10240
          example: 10
        VpcConfig:
          $ref: '#/components/schemas/VpcConfig'
        Environment:
          type: object
          properties:
            Variables:
              type: object
              additionalProperties:
                type: string
          example: example_value
        Runtime:
          type: string
          description: The runtime identifier
          example: example_value
        DeadLetterConfig:
          type: object
          properties:
            TargetArn:
              type: string
          example: example_value
        KMSKeyArn:
          type: string
          example: example_value
        TracingConfig:
          type: object
          properties:
            Mode:
              type: string
              enum:
              - Active
              - PassThrough
          example: example_value
        RevisionId:
          type: string
          description: Update only if the revision ID matches. Prevents modifying a function that has changed since you last read it.
          example: '500123'
        Layers:
          type: array
          items:
            type: string
          maxItems: 5
          example: []
        EphemeralStorage:
          type: object
          properties:
            Size:
              type: integer
              minimum: 512
              maximum: 10240
          example: example_value
        SnapStart:
          type: object
          properties:
            ApplyOn:
              type: string
              enum:
              - PublishedVersions
              - None
          example: example_value
        LoggingConfig:
          type: object
          properties:
            LogFormat:
              type: string
              enum:
              - JSON
              - Text
            ApplicationLogLevel:
              type: string
            SystemLogLevel:
              type: string
            LogGroup:
              type: string
          example: example_value
    CreateFunctionRequest:
      type: object
      required:
      - FunctionName
      - Role
      - Code
      description: Request body for creating a Lambda function
      properties:
        FunctionName:
          type: string
          description: The name of the Lambda function (1-64 characters). Can also specify an ARN.
          minLength: 1
          maxLength: 64
          example: example_value
        Runtime:
          type: string
          description: The identifier of the function's runtime. Required for .zip file deployment packages.
          example: example_value
        Role:
          type: string
          description: The ARN of the function's execution role
          example: example_value
        Handler:
          type: string
          description: The name of the function handler (e.g. index.handler)
          maxLength: 128
          example: example_value
        Code:
          $ref: '#/components/schemas/FunctionCode'
        Description:
          type: string
          description: Description of the function
          maxLength: 256
          example: A sample description.
        Timeout:
          type: integer
          description: Execution timeout in seconds
          default: 3
          minimum: 1
          maximum: 900
          example: 10
        MemorySize:
          type: integer
          description: Memory allocated in MB
          default: 128
          minimum: 128
          maximum: 10240
          example: 10
        Publish:
          type: boolean
          description: Set to true to publish the first version of the function
          default: false
          example: true
        VpcConfig:
          $ref: '#/components/schemas/VpcConfig'
        PackageType:
          type: string
          description: The type of deployment package
          enum:
          - Zip
          - Image
          default: Zip
          example: Zip
        DeadLetterConfig:
          type: object
          properties:
            TargetArn:
              type: string
              description: ARN of an SQS queue or SNS topic
          example: example_value
        Environment:
          type: object
          properties:
            Variables:
              type: object
              additionalProperties:
                type: string
          example: example_value
        KMSKeyArn:
          type: string
          description: ARN of the KMS key to encrypt environment variables
          example: example_value
        TracingConfig:
          type: object
          properties:
            Mode:
              type: string
              enum:
              - Active
              - PassThrough
          example: example_value
        Tags:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for tagging the function
          example: example_value
        Layers:
          type: array
          description: A list of function layer ARNs (with version) to add to the function's execution environment. Up to five layers.
          items:
            type: string
          maxItems: 5
          example: []
        Architectures:
          type: array
          description: The instruction set architecture
          items:
            type: string
            enum:
            - x86_64
            - arm64
          maxItems: 1
          example: []
        EphemeralStorage:
          type: object
          properties:
            Size:
              type: integer
              minimum: 512
              maximum: 10240
          example: example_value
        SnapStart:
          type: object
          properties:
            ApplyOn:
              type: string
              enum:
              - PublishedVersions
              - None
          example: example_value
        LoggingConfig:
          type: object
          properties:
            LogFormat:
              type: string
              enum:
              - JSON
              - Text
            ApplicationLogLevel:
              type: string
            SystemLogLevel:
              type: string
            LogGroup:
              type: string
          example: example_value
    VpcConfigResponse:
      type: object
      description: VPC connectivity details returned by Lambda
      properties:
        SubnetIds:
          type: array
          items:
            type: string
          example: []
        SecurityGroupIds:
          type: array
          items:
            type: string
          example: []
        VpcId:
          type: string
          description: The VPC ID
          example: '500123'
    VpcConfig:
      type: object
      description: VPC connectivity settings for a Lambda function
      properties:
        SubnetIds:
          type: array
          description: A list of VPC subnet IDs
          items:
            type: string
          maxItems: 16
          example: []
        SecurityGroupIds:
          type: array
          description: A list of VPC security group IDs
          items:
            type: string
          maxItems: 5
          example: []
    Layer:
      type: object
      description: An Lambda layer attached to a function
      properties:
        Arn:
          type: string
          description: The ARN of the function layer
          example: example_value
        CodeSize:
          type: integer
          description: The size of the layer archive in bytes
          format: int64
          example: 10
        SigningProfileVersionArn:
          type: string
          description: The ARN of a signing profile version
          example: example_value
        SigningJobArn:
          type: string
          description: The ARN of a signing job
          example: example_value
    ListFunctionsResponse:
      type: object
      description: Paginated list of Lambda functions
      properties:
        NextMarker:
          type: string
          description: Pagination token for the next page of results
          example: example_value
        Functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionConfiguration'
          example: []
    FunctionConfiguration:
      type: object
      description: A Lambda function's configuration and metadata
      properties:
        FunctionName:
          type: string
          description: The name of the function
          example: example_value
        FunctionArn:
          type: string
          description: The function's Amazon Resource Name (ARN)
          example: example_value
        Runtime:
          type: string
          description: The identifier of the function's runtime. Runtime is required if the deployment package is a .zip file archive.
          enum:
          - nodejs18.x
          - nodejs20.x
          - nodejs22.x
          - python3.9
          - python3.10
          - python3.11
          - python3.12
          - python3.13
          - java11
          - java17
          - java21
          - dotnet6
          - dotnet8
          - ruby3.2
          - ruby3.3
          - provided
          - provided.al2
          - provided.al2023
          example: nodejs18.x
        Role:
          type: string
          description: The function's execution role ARN
          example: example_value
        Handler:
          type: string
          description: The function entrypoint in your code. The format includes the file name without extension and the handler function name (e.g. index.handler)
          example: example_value
        CodeSize:
          type: integer
          description: The size of the function's deployment package in bytes
          format: int64
          example: 10
        Description:
          type: string
          description: The function's description
          example: A sample description.
        Timeout:
          type: integer
          description: The amount of time in seconds that Lambda allows a function to run before stopping it. Maximum is 900 seconds (15 minutes).
          minimum: 1
          maximum: 900
          example: 10
        MemorySize:
          type: integer
          description: The amount of memory available to the function at runtime in MB. Lambda allocates CPU power in proportion to the amount of memory configured.
          minimum: 128
          maximum: 10240
          example: 10
        LastModified:
          type: string
          description: The date and time the function was last updated in ISO 8601 format
          example: example_value
        CodeSha256:
          type: string
          description: The SHA-256 hash of the function's deployment package
          example: example_value
        Version:
          type: string
          description: The version of the Lambda function
          example: example_value
        VpcConfig:
          $ref: '#/components/schemas/VpcConfigResponse'
        DeadLetterConfig:
          type: object
          description: The function's dead-letter queue configuration
          properties:
            TargetArn:
              type: string
              description: The ARN of the SQS queue or SNS topic for failed events
          example: example_value
        Environment:
          type: object
          description: The function's environment variables
          properties:
            Variables:
              type: object
              additionalProperties:
                type: string
              description: Environment variable key-value pairs
            Error:
              type: object
              description: Error if Lambda was unable to set up environment variables
              properties:
                ErrorCode:
                  type: string
                Message:
                  type: string
          example: example_value
        KMSKeyArn:
          type: string
          description: The ARN of the KMS key used to encrypt the function's environment variables at rest
          example: example_value
        TracingConfig:
          type: object
          description: The function's X-Ray tracing configuration
          properties:
            Mode:
              type: string
              enum:
              - Active
              - PassThrough
          example: example_value
        MasterArn:
          type: string
          description: For Lambda@Edge functions, the ARN of the main function
          example: example_value
        RevisionId:
          type: string
          description: The latest updated revision of the function
          example: '500123'
        Layers:
          type: array
          description: The function's layers
          items:
            $ref: '#/components/schemas/Layer'
          example: []
        State:
          type: string
          description: The current state of the function
          enum:
          - Pending
          - Active
          - Inactive
          - Failed
          example: Pending
        StateReason:
          type: string
          description: The reason for the function's current state
          example: example_value
        StateReasonCode:
          type: string
          description: The reason code for the function's current state
          enum:
          - Idle
          - Creating
          - Restoring
          - EniLimitExceeded
          - InsufficientRolePermissions
          - InvalidConfiguration
          - InternalError
          - SubnetOutOfIPAddresses
          - InvalidSubnet
          - InvalidSecurityGroup
          - ImageDeleted
          - ImageAccessDenied
          - InvalidImage
          - KMSKeyAccessDenied
          - KMSKeyNotFound
          - InvalidStateKMSKey
          - DisabledKMSKey
          - EFSIOError
          - EFSMountConnectivityError
          - EFSMountFailure
          - EFSMountTimeout
          - InvalidRuntime
          - InvalidZipFileException
          - FunctionError
          example: Idle
        LastUpdateStatus:
          type: string
          description: The status of the last update that was performed on the function
          enum:
          - Successful
          - Failed
          - InProgress
          example: Successful
        LastUpdateStatusReason:
          type: string
          description: The reason for the last update that was performed on the function
          example: example_value
        LastUpdateStatusReasonCode:
          type: string
          description: The reason code for the last update
          example: example_value
        PackageType:
          type: string
          description: The type of deployment package
          enum:
          - Zip
          - Image
          example: Zip
        ImageConfigResponse:
          type: object
          description: The function's image configuration values for container images
          properties:
            ImageConfig:
              type: object
              properties:
                EntryPoint:
                  type: array
                  items:
                    type: string
                Command:
                  type: array
                  items:
                    type: string
                WorkingDirectory:
                  type: string
            Error:
              type: object
              properties:
                ErrorCode:
                  type: string
                Message:
                  type: string
          example: example_value
        Architectures:
          type: array
          description: The instruction set architecture that the function supports
          items:
            type: string
            enum:
            - x86_64
            - arm64
          maxItems: 1
          example: []
        EphemeralStorage:
          type: object
          description: The size of the function's /tmp directory in MB
          properties:
            Size:
              type: integer
              minimum: 512
              maximum: 10240
          example: example_value
        SnapStart:
          type: object
          description: The function's SnapStart setting for reducing cold start latency
          properties:
            ApplyOn:
              type: string
              enum:
              - PublishedVersions
              - None
            OptimizationStatus:
              type: string
              enum:
              - true
              - false
          example: example_value
        RuntimeVersionConfig:
          type: object
          description: The ARN of the runtime and any errors that occurred
          properties:
            RuntimeVersionArn:
              type: string
            Error:
              type: object
              properties:
                ErrorCode:
                  type: string
                Message:
                  type: string
          example: example_value
        LoggingConfig:
          type: object
          description: The function's Amazon CloudWatch Logs configuration
          properties:
            LogFormat:
              type: string
              enum:
              - JSON
              - Text
            ApplicationLogLevel:
              type: string
              enum:
              - TRACE
              - DEBUG
              - INFO
              - WARN
              - ERROR
              - FATAL
            SystemLogLevel:
              type: string
              enum:
              - DEBUG
              - INFO
              - WARN
            LogGroup:
              type: string
              description: The name of the CloudWatch log group
          example: example_value
    GetFunctionResponse:
      type: object
      description: Response containing function details and code location
      properties:
        Configuration:
          $ref: '#/components/schemas/FunctionConfiguration'
        Code:
          type: object
          description: The deployment package of the function
          properties:
            RepositoryType:
              type: string
              description: The service hosting the file (S3 or ECR)
            Location:
              type: string
              description: A presigned URL you can use to download the deployment package
            ImageUri:
              type: string
              description: URI of the container image
            ResolvedImageUri:
              type: string
              description: The resolved URI for the image
          example: example_value
        Tags:
          type: object
          additionalProperties:
            type: string
          description: The function's tags
          example: example_value
        Concurrency:
          type: object
          properties:
            ReservedConcurrentExecutions:
              type: integer
              description: Reserved concurrency for the function
          example: example_value
  securitySchemes:
    sigv4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4 authentication. Requests must be signed with valid AWS credentials that have the appropriate Lambda IAM permissions.
externalDocs:
  description: AWS Lambda API Reference
  url: https://docs.aws.amazon.com/lambda/latest/api/welcome.html
